<h2>NgRx Effects</h2>

<button (click)="load()">LoadUsers</button>

<div>
  @if (users$ | async; as userState) {
    @if (userState.loading) {
      loading....
    }

    <ul>
      @for (user of userState.users; track user.id) {
        <li>{{ user.name }} - {{ user.email }}</li>
      }
    </ul>
  }
</div>
